name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  basic-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository files
        run: |
          test -f README.md
          test -f .gitignore
          echo "Basic checks passed"